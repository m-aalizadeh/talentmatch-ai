services:
  postgres:
    image: postgres:17
    container_name: talentmatch-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: talentmatch
      POSTGRES_PASSWORD: talentmatch_dev
      POSTGRES_DB: talentmatch

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U talentmatch -d talentmatch"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
